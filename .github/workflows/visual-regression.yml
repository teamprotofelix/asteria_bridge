name: Visual regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify asset hashes and event rules
        run: node --test tests/*.test.js
      - name: Install Playwright and Chromium
        run: |
          python3 -m venv .qa-venv
          .qa-venv/bin/pip install playwright==1.62.0
          .qa-venv/bin/python -m playwright install --with-deps chromium
      - name: Verify voyage persistence, custom watch and PWA
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .qa-venv/bin/python tests/voyage_pr14.py
      - name: Upload voyage review captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: voyage-pr14-captures
          path: voyage-pr14-captures
          if-no-files-found: ignore
      - name: Verify local Marie commands and approved adapter
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .qa-venv/bin/python tests/command_pr13.py
      - name: Upload Marie command captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: command-pr13-captures
          path: command-pr13-captures
          if-no-files-found: ignore
      - name: Verify free flight and the expanded event catalog
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .qa-venv/bin/python tests/flight_pr12.py
      - name: Upload free flight and event captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flight-pr12-captures
          path: flight-pr12-captures
          if-no-files-found: ignore
      - name: Check Marie rig, crew actions and mobile fallback
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: .qa-venv/bin/python tests/marie_pr11.py
      - name: Upload Living Marie review captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marie-pr11-captures
          path: marie-pr11-captures
          if-no-files-found: ignore
      - name: Check the habitable bridge and capture workstations
        run: .qa-venv/bin/python tests/bridge_pr10.py
      - name: Upload bridge review captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-pr10-captures
          path: bridge-pr10-captures
          if-no-files-found: ignore
      - name: Run static HTTP browser tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          .qa-venv/bin/python tests/browser_smoke.py
          .qa-venv/bin/python tests/quality_pr9.py
